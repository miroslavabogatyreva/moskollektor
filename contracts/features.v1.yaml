# Признаки, которые мы отдаём модели Николая.
#
# Что здесь лежит: имя признака, тип, единица измерения, окно агрегации и таблица
# с колонкой, откуда мы его читаем. Значения едут в POST /predict колонками —
# имена один раз, числа на каждый объект.
#
# Состав списка: только то, что считается из выгрузки от 09.09.2026. Признаки,
# под которые заказчик не прислал данных, сюда не попали — они перечислены внизу
# в ключе `not_in_v1`, чтобы было видно, чего мы не считаем и почему.
#
# Проверить, что файл разбирается:
#   ~/.venv/mk/bin/python -c "import yaml; d=yaml.safe_load(open('contracts/features.v1.yaml')); \
#     n=[f['name'] for f in d['features']]; assert len(n)==len(set(n)), 'дубли имён'; \
#     print(len(n), 'признаков, порядок:', n[0], '...', n[-1])"

schema_version: feat.v1
updated: 2026-09-15

# Три правила формата. Все три проверяет ML-контейнер, а не мы на словах.
rules:
  layout: columns
  # Имена признаков едут один раз, значения — массивом на каждый объект.
  # 22 имени против 22 чисел × 3173 участка: разница между 30 КБ и 900 КБ запроса.

  order_is_contract: true
  # Порядок имён в `features` — часть контракта. ML-контейнер обязан сверить
  # пришедший feature_names со своим и вернуть 422 при несовпадении.
  # Молча переставленные колонки дают уверенный неверный ответ без единой ошибки:
  # поменяй местами readings_1d и readings_7d — модель прочитает недельный счётчик
  # как суточный и увидит очень активный участок там, где его нет.

  null_means_missing: true
  # null — это «признака нет», а не ноль. Ноль у days_since_last_reading означает
  # «писал сегодня», null означает «не писал никогда». Бустинги работают
  # с пропусками нативно, подменять их нулями нельзя.

# Единица наблюдения. Один и тот же счётчик за 7 дней по участку и по каналу —
# это разные числа с разных сущностей, поэтому scope стоит у каждого признака.
#   section — участок «коллектор:пикет», 3173 штуки, ключ ref.object_xref.smvu_key
#   channel — канал СМВУ, 11 485 в справочнике заказчика
#   prefix  — коллектор, первое число тега; 30 коллекторов, медиана 178 каналов

features:

  # --- по участку: сколько всего пишут датчики этого участка -----------------
  - name: readings_1d
    type: int
    unit: показаний
    window: 1d
    scope: section
    source: smvu.reading(section_id, read_time)
    note: >
      Это счётчик ПОКАЗАНИЙ, а не событий. В контракте он раньше назывался ev_1d
      и подразумевал тревоги — так считать нельзя: у участка 797:178 за 2025-2026
      год 2 002 990 показаний и 9 тревог, разница в 222 554 раза. Тревоги считает
      alarms_7d/alarms_365d, здесь именно поток записей.

  - name: readings_7d
    type: int
    unit: показаний
    window: 7d
    scope: section
    source: smvu.reading(section_id, read_time)

  - name: readings_30d
    type: int
    unit: показаний
    window: 30d
    scope: section
    source: smvu.reading(section_id, read_time)

  - name: readings_365d
    type: int
    unit: показаний
    window: 365d
    scope: section
    source: smvu.reading(section_id, read_time)

  # --- по участку: тревоги ---------------------------------------------------
  - name: alarms_7d
    type: int
    unit: тревог
    window: 7d
    scope: section
    source: smvu.reading(section_id, read_time) WHERE is_alarm
    note: >
      Флаг тревоги ставит прибор по своей уставке, а не бригада по факту выезда.
      Поэтому это «частота шума» из постановки, но НЕ ложность срабатывания:
      отличить ложную тревогу от настоящей выгрузка не позволяет.
      Всего тревог в архиве 2 467 812 из 313 546 016 строк, это 0,79 %.

  - name: alarms_365d
    type: int
    unit: тревог
    window: 365d
    scope: section
    source: smvu.reading(section_id, read_time) WHERE is_alarm

  - name: days_since_last_reading
    type: int
    unit: сутки
    window: null
    scope: section
    source: smvu.reading(section_id, read_time)
    note: >
      Раньше назывался days_since_last_event. Переименован по той же причине,
      что и readings_*: последнее «событие» здесь — последнее показание.
      На срезе 30.06.2026 по 3173 участкам: медиана 13 суток, максимум 484,
      писали в последний день выгрузки 932 участка.

  - name: sensor_count
    type: int
    unit: каналов
    window: null
    scope: section
    source: smvu.channel(section_id)
    note: >
      Участок собирается из тега и названия канала скриптом backend/app/ingest/tag_to_section.py:
      пара «коллектор:пикет». Привязались 10 720 каналов справочника из 11 485
      (93,3 %), получилось 3173 участка на 30 коллекторах. Оставшиеся 765 — датчики
      внутри диспетчерских пунктов, участка у них нет по существу.

  - name: silent_share_30d
    type: float
    unit: доля 0..1
    window: 30d
    scope: section
    source: smvu.reading(section_id, channel_id, read_time)
    note: >
      Доля каналов участка, не написавших ни строки за 30 суток. Среднее по 3173
      участкам — 0,289. ВНИМАНИЕ, подпись в схеме («доля молчащих датчиков:
      признак „мы ослепли“») неверна: каналов, молчавших все 7,5 лет, ноль,
      а в обычные сутки молчит 84-88 % парка — это норма работы журнала, который
      пишет только смены состояния. Признак меряет активность участка, а не здоровье
      датчика. Сравнивать его значения можно только внутри одного типа датчика.
      До 15.09.2026 колонку feat.section_daily.silent_channels не заполнял никто,
      и признак выходил ровно нулём у всех участков; функция refresh_section_daily
      починена коммитом 9fb0cb6.

  # --- по каналу: поведение канала относительно его собственной нормы --------
  - name: chatter_7d
    type: int
    unit: записей «Неисправен»
    window: 7d
    scope: channel
    source: smvu.reading(channel_id, read_time, value_text)
    note: >
      Дребезг самого канала. За 2025 год ненулевой у 29 631 канало-дня
      из 574 627 (5,16 %), максимум 7 384.

  - name: fault_30d
    type: bool
    unit: безразмерное
    window: 30d
    scope: channel
    source: smvu.fault_episode(channel_id, started_at)
    note: >
      Был ли у этого канала отказ за 30 суток до среза. Отказ — эпизод «Неисправен»
      длиннее часа (порог в smvu.fault_rule.min_duration_seconds). Из 965 отказов
      2025 года у 326 (33,8 %) предыдущий отказ того же канала уже был.

  - name: freeze_3
    type: bool
    unit: безразмерное
    window: 7d
    scope: channel
    source: smvu.reading(channel_id, read_time, value_text)
    note: >
      Значение повторилось три раза подряд. Считается, но на нашей цели почти
      не срабатывает: за 2025 год 1 435 срабатываний на 314 каналах, и на значении
      «Неисправен» — пять раз за год. Остальное это «Выключен» 512, «Включен» 458,
      «Норма» 341. Как вход в модель годится, как самостоятельное правило — нет.

  - name: undefined_share_7d
    type: float
    unit: доля 0..1
    window: 7d
    scope: channel
    source: smvu.reading(channel_id, read_time, value_text)
    note: >
      Доля значения «Неопределен» среди записей канала. Признак почти общепарковый:
      479 180 записей за 2025 год на 10 817 каналах из 11 483 (94,2 %).

  - name: rate_ratio_7d
    type: float
    unit: отношение
    window: 7d
    scope: channel
    source: smvu.reading(channel_id, read_time)
    note: >
      Темп записей за 7 суток к собственному фону канала за предыдущие 8 недель.
      Определён на 542 357 канало-днях из 574 627 (94,4 %): у остальных фона нет.

  - name: rate_ratio_year
    type: float
    unit: отношение
    window: 7d
    scope: channel
    source: smvu.reading(channel_id, read_time)
    note: >
      То же, но фон берётся за год. Это признак, давший в замере упреждение
      в 21 сутки на умирающем канале. Пример: канал 213785 (газовый) за год
      79 282 записи, недельная норма 1 521, за неделю до 07.11.2025 — 4 записи,
      отношение 0,003.

  - name: gap_to_median
    type: float
    unit: отношение
    window: null
    scope: channel
    source: smvu.reading(channel_id, read_time)
    note: >
      Текущий интервал между записями, делённый на медианный интервал ЭТОГО канала.
      Общий порог здесь бессмыслен: p95 интервала у газового датчика 285 секунд,
      у датчика дыма 1 958 674 секунды — разница в 6 873 раза. Датчик дыма,
      молчащий сутки, это норма; газовый, молчащий сутки, это отказ.

  - name: long_gap_share_7d
    type: float
    unit: доля 0..1
    window: 7d
    scope: channel
    source: smvu.reading(channel_id, read_time)
    note: >
      Доля интервалов длиннее собственного p95 канала. Покрытие узкое: при недельном
      окне хотя бы 20 интервалов набирают 640 каналов из 11 483. У остальных
      приедет null, и это правильное значение, а не ноль.

  - name: silence_normalized
    type: float
    unit: отношение
    window: null
    scope: channel
    source: smvu.reading(channel_id, read_time)
    note: >
      Время с последней записи, делённое на медианный интервал этого канала.
      Пример: канал 288176 «ГАЗ Д9 ПК99» последний раз написал 14.06.2025 при своей
      медиане 6 секунд; на срезе 31.12.2025 это 2,9 млн собственных медиан.
      Не считается у 104 каналов из 11 483: у них медианный интервал 0 секунд.

  # --- по префиксу: что происходит на всём шлейфе ----------------------------
  - name: neighbor_fault_7d
    type: bool
    unit: безразмерное
    window: 7d
    scope: prefix
    source: smvu.fault_episode + smvu.channel(collector)
    note: >
      Был ли отказ у соседа по тому же коллектору за 7 суток. За 2025 год
      959 отказов на 22 коллекторах, 159 коллекторо-дней с отказом.

  - name: bad7
    type: int
    unit: записей «Неисправен»
    window: 7d
    scope: prefix
    source: smvu.reading + smvu.channel(collector)
    note: >
      Число записей «Неисправен» по всему коллектору за 7 суток. В замере это
      единственное правило, перешагнувшее требуемую постановкой полноту 0,5:
      при пороге bad7 >= 20 полнота 0,524 при точности 0,011. Как самостоятельное
      правило не годится (4 058 предупреждений — это 23 % всех коллекторо-дней),
      как признак — берём обязательно.
      Распределение за 2025 год по 11 315 коллекторо-дням: медиана 0, p95 131,
      максимум 32 027 (коллектор 797, 07.11.2025).

  # --- календарь -------------------------------------------------------------
  - name: season_sin
    type: float
    unit: безразмерное, -1..1
    window: null
    scope: section
    source: функция от read_time, данных не требует
    note: >
      Глубины хватает с запасом: архив с 01.01.2019 по 30.06.2026, это 7,5 лет
      при нужных двух. Но сезонная волна есть только там, где датчик отдаёт число,
      а таких каналов 892 из 11 483 (7,8 %): газовые 455 и температурные 436.
      «Тепловой датчик» числом НЕ является: 472 канала, 501 064 записи за 7,5 лет,
      числовых среди них ноль — это пожарный извещатель с порогом, а не термометр.
      На остальных 92 % парка признак посчитается арифметически и не будет значить
      ничего.

  - name: season_cos
    type: float
    unit: безразмерное, -1..1
    window: null
    scope: section
    source: функция от read_time, данных не требует

# ---------------------------------------------------------------------------
# Чего в v1 нет и почему. Проверено 15.09.2026 по всем 313 546 016 строкам.
# Признак вернётся сюда версией v2, когда заказчик пришлёт данные.
# ---------------------------------------------------------------------------
not_in_v1:

  - name: confirmed_365d
    reason: >
      Разметки «тревога подтвердилась» в выгрузке нет. В журнале шесть колонок
      и 32 текстовых состояния, ни одно не означает исход проверки.
    waiting_for: журналы ОДС (ОВ-47)

  - name: false_rate_365d
    reason: >
      То же. Суррогат «доля тревожное = t» не годится: флаг ставит прибор
      по уставке, а ложность определяет бригада на выезде. Это самая дорогая
      потеря: постановка строит направление «отказ датчика» дословно
      «на основе анализа паттернов ложных сработок».
    waiting_for: журналы ОДС (ОВ-47)

  - name: days_since_last_repair
    reason: Журнала ремонтов заказчик не прислал, maint.work_order пуста.
    waiting_for: выгрузка ТОиР

  - name: age_years
    reason: >
      Дат ввода в эксплуатацию нет: в обоих справочниках ноль строк
      с датой любого формата.
    waiting_for: реестр оборудования (ОВ-28)

  - name: criticality
    reason: >
      Из выгрузки не берётся вовсе. Наша методика в code/criticality.py требует
      десяти факторов, и ни один из них выгрузкой не закрывается: возраст ждёт
      дат ввода, история отказов — разметки, состояние — актов осмотра.
      На приёмке это надо называть вслух: наша экспертная оценка, а не данные
      заказчика.
    waiting_for: данные для заполнения либо экспертная оценка руками

  - name: zero_drift_max
    reason: >
      Две причины, и вторая хуже первой. Единица измерения газового канала
      не названа нигде — ни в выгрузке, ни в Регламенте применительно к колонке
      значения (вопрос В-9). И сам дрейф в данных кончился: отрицательные значения
      у газовых каналов были в 2020 году (1 005 704 строки, 42 канала, минимум
      -10,23) и в 2021 (675 009 строк, 23 канала), а с 2022 по июнь 2026 их ноль.
      Последние 4,5 года минимум ровно 0,00.
    waiting_for: ответ на В-9 и объяснение, что случилось с газовыми каналами в 2022

  - name: hot_work_4h
    reason: Реестр допусков АРМ-Контроль не прислан, схема permit.* пуста целиком.
    waiting_for: выгрузка АРМ-Контроль

  - name: hot_work_man_hours_30d
    reason: То же. Плюс имени такого нет нигде, кроме двух строк docs/HLD.md.
    waiting_for: выгрузка АРМ-Контроль

  - name: permits_active_cnt
    reason: То же.
    waiting_for: выгрузка АРМ-Контроль

  - name: detector_inhibited
    reason: >
      Состояние «Отключено устройство» в журнале есть — 9 189 строк на 3 178
      каналах за 7,5 лет. Но признак означает «отключён ПО НАРЯДУ», а отличить
      отключение по допуску от самопроизвольного нечем.
    waiting_for: выгрузка АРМ-Контроль

# ---------------------------------------------------------------------------
# Что Николаю надо знать про эти данные до обучения
# ---------------------------------------------------------------------------
data_caveats:

  - >
    Внутри ext-journal-2025.csv повторяется строка заголовка — на строке 26 140 585.
    Файлы склеены из кусков. Без фильтра `WHERE ид_события <> 'ид_события'`
    разбор колонок падает.

  - >
    1 142 канала пишут в журнал, но их нет в справочнике заказчика — ни типа,
    ни тега, ни названия. Это 17,4 % строк журнала, которые ни к какому участку
    не приписываются. В схеме они заводятся как smvu.channel.is_stub.

  - >
    Журнал пишет только смены состояния. Повторов предыдущего значения подряд
    за 2025 год 0,0336 % (18 642 из 55 530 313 пар). Поэтому деградация здесь
    выглядит как выросший интервал между записями, а не как повторяющееся значение.

  - >
    Сортировать журнал надо по (дата, время, ид_события). 1 305 295 строк за 2025 год
    делят канал и метку времени; без тай-брейка по ид_события число эпизодов
    «Неисправен» меняется со 103 136 на 95 716 — расхождение 7,2 %.

  - >
    У датчика температуры минимум -3276,0 и максимум 999,0 — это сигнальные коды
    прибора, а не градусы. Отрицательные значения есть каждый год у 204-310 каналов.
    Фильтровать до обучения, иначе сезонность посчитается по мусору.

  - >
    У 31 канала в поле значения лежит дата `01.01.1970 03:00:01` — 131 508 строк.

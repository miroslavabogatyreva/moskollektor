# Пуш в master → быстрые проверки → выкладка на стенд (deploy/deploy.sh).
# Правка только документов стенд не трогает. Руками — вкладка Actions, «Run workflow».
# Ключ DEPLOY_SSH_KEY в authorized_keys сервера привязан к deploy.sh (command=...),
# ничего другого им на сервере сделать нельзя. Устройство — docs/server.md.
name: deploy

on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: фронт собирается и проходит tsc
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run typecheck && npm run build
      - name: самопроверки, которым не нужны база и стенд
        run: |
          python3 code/check_schema.py
          python3 code/check_stale_fetch.py

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: выложить на стенд
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh root@135.106.216.101

# nginx стенда «Москоллектор».
# Здесь закрывается строка приёмки НФ-75: TLS не ниже 1.2, шифров RC4 и 3DES нет.
# Проверка: nmap --script ssl-enum-ciphers -p 443 <адрес>

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;

    # --- НФ-75: версии протокола --------------------------------------------
    # Ровно две строки, ниже 1.2 не остаётся ничего: TLS 1.0 и 1.1 сюда
    # не вписаны, SSLv2 и SSLv3 nginx не умеет с версии 1.23 вовсе.
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- НФ-75: наборы шифров -----------------------------------------------
    # Список для TLS 1.2, взят из профиля Mozilla intermediate. Ни RC4, ни 3DES,
    # ни экспортных наборов: только ECDHE с AES-GCM и ChaCha20-Poly1305.
    # Шифрами TLS 1.3 эта директива не управляет, там свой набор из трёх
    # наборов AEAD, и RC4 с 3DES в нём нет по самому стандарту.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    # Сертификат стенда — RSA, поэтому из шести наборов выше сервер предложит
    # только три RSA-набора: наборы ECDSA требуют сертификата на эллиптической
    # кривой. Это не недонастройка, и в протокол НФ-75 строку надо вписать
    # заранее, иначе на приёмке придётся объясняться по выводу nmap.

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Порт 80 отвечает только редиректом: открытым текстом не ходит ничего.
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Встроенный DNS Docker. Нужен, чтобы имя api резолвилось в момент
        # запроса, а не при старте: без этого nginx не поднимется вовсе, пока
        # контейнера api не существует, — а его не существует до Q4.
        resolver 127.0.0.11 valid=10s ipv6=off;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Поток уведомлений (SSE, Q4.5). Буферизацию выключаем: с ней кадры
        # копятся в nginx и до диспетчера доходят пачкой, а не по одному.
        location /api/v1/stream {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header Connection        "";
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }
    }
}

# nginx стенда «Москоллектор».
# Здесь закрывается строка приёмки НФ-75: TLS не ниже 1.2, шифров RC4 и 3DES нет.
# Проверка: nmap --script ssl-enum-ciphers -p 443 <адрес>

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # --- Ограничение частоты запросов ---------------------------------------
    # Ставим здесь, а не правилами сети: докер пускает трафик к опубликованным
    # портам через хук forward, а fail2ban на сервере стоит на хуке input и
    # смотрит только порт 22 — то есть запрос к 80 и 443 он не увидит вовсе.
    # Замер 15.09.2026 на 135.106.216.101: в таблице f2b-table одна цепочка
    # `hook input` с единственным правилом `tcp dport 22`, а цепочки DOCKER-*
    # своего хука не имеют и вызываются из FORWARD. nginx же видит каждый
    # запрос независимо от того, чем заказчик рулит сетью.
    #
    # Ключ — адрес клиента. 30 запросов в секунду с всплеском до 120 без
    # задержки, и только на /api/ и описание API: статику отдаёт сам nginx,
    # до api и базы она не доходит, и резать её незачем. Строка приёмки НФ-74
    # требует 20 одновременных пользователей, а в корпоративной сети все
    # двадцать могут прийти с одного адреса через общий шлюз.
    #
    # До 27.09.2026 здесь стоял всплеск 60 на всё подряд — из прикидки, что
    # открытие экрана стоит от одного до трёх запросов. Нагрузочный прогон
    # deploy/load/20-users.mjs (задача 1.4) это опроверг: дашборд с пустым
    # кэшем — 9 запросов (страница, бандл, стили, sections.json и пять к API),
    # 20 диспетчеров разом — около 180, и лимит отказал 108 из них кодом 429.
    # К API из них идут 100: /api/auth/me, /api/risks, /api/data-status,
    # /api/notifications и поток /api/alerts/stream на каждого, — отсюда 120
    # с запасом. Постоянные 30 в секунду при двадцати людях — полтора запроса
    # на человека, сценарий 1.4 даёт меньше.
    # Меняете числа — повторите оба замера: нагрузку (не режет своих)
    # и флуд из 400 запросов к /api/ (вообще работает), docs/load-test.md.
    limit_req_zone $binary_remote_addr zone=arm:10m rate=30r/s;
    limit_req_status 429;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;

    # --- НФ-75: версии протокола --------------------------------------------
    # Ровно две строки, ниже 1.2 не остаётся ничего: TLS 1.0 и 1.1 сюда
    # не вписаны, SSLv2 и SSLv3 nginx не умеет с версии 1.23 вовсе.
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- НФ-75: наборы шифров -----------------------------------------------
    # Список для TLS 1.2, взят из профиля Mozilla intermediate. Ни RC4, ни 3DES,
    # ни экспортных наборов: только ECDHE с AES-GCM и ChaCha20-Poly1305.
    # Шифрами TLS 1.3 эта директива не управляет, там свой набор из трёх
    # наборов AEAD, и RC4 с 3DES в нём нет по самому стандарту.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    # Сертификат стенда — RSA, поэтому из шести наборов выше сервер предложит
    # только три RSA-набора: наборы ECDSA требуют сертификата на эллиптической
    # кривой. Это не недонастройка, и в протокол НФ-75 строку надо вписать
    # заранее, иначе на приёмке придётся объясняться по выводу nmap.

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Порт 80 отвечает только редиректом: открытым текстом не ходит ничего.
    server {
        listen 80 default_server;
        # Вторая строка открывает вход по новому виду адресов (IPv6). Без неё
        # nginx слушает только 0.0.0.0, и клиент, пришедший на ::1, получает
        # connection refused — сервер при этом исправен, и в журнале пусто.
        listen [::]:80 default_server;
        server_name _;

        # Проверка Let's Encrypt для сертификата демо-стенда (задача 1.10,
        # deploy/demo-cert.sh): удостоверяющий центр приходит только по порту 80
        # и ждёт файл, а не редирект. Всё остальное по-прежнему уходит на https.
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        # Порт https в адресе редиректа берётся из HTTPS_PORT: демо слушает 8443,
        # и без порта редирект с его 8080 уводил на основной стенд. Файл пишет образ
        # nginx при старте из deploy/nginx/templates/https-redirect.conf.template.
        location / {
            include /etc/nginx/conf.d/https-redirect.conf;
        }
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Встроенный DNS Docker. Нужен, чтобы имя api резолвилось в момент
        # запроса, а не при старте: без этого nginx не поднимется вовсе, пока
        # контейнера api не существует, — а его не существует до Q4.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Приложение и заглушка живут в разных каталогах (задача 1.11, MOS-246).
        # app — собранный фронт, его кладёт deploy/deploy.sh, в git его нет;
        # html — страница «Стенд поднят» из задачи 1.1, она в git. Раньше обе
        # лежали в html, и любой разворот дерева из git (reset, checkout, чистый
        # клон) клал заглушку поверх приложения при коде 200. Теперь git трогает
        # только html, а заглушка отдаётся, лишь пока app пуст — на свежей
        # установке без сборки фронта, чтобы healthcheck был зелёным и там.
        root /usr/share/nginx/app;

        # Корень отдельно: "/" кончается косой чертой, и try_files $uri увидел бы
        # в нём каталог — пустой app дал бы 403, а не заглушку.
        location = / {
            try_files /index.html @stub;
        }

        location / {
            try_files $uri /index.html @stub;
        }

        location @stub {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # Описание API мимо префикса /api/. Строка приёмки М-17 проверяется
        # действием «открыть документацию», а FastAPI держит /docs, /redoc и
        # /openapi.json на корне, не под /api (backend/app/api/main.py). Без
        # этой локации их забирает `try_files ... /index.html` выше и отдаёт
        # страницу интерфейса кодом 200 — приёмщик открывает /docs и видит
        # дашборд. Поймано 16.09.2026 с двух сторон сразу: прогоном
        # contracts/examples/api/examples.sh и вручную (curl /openapi.json
        # вернул <!doctype html>).
        #
        # /health сюда же: снаружи он был недоступен вовсе, а healthcheck
        # контейнера ходит внутрь по 127.0.0.1:8000 и о внешнем пути ничего
        # не знает.
        #
        # Ловушка на приёмке: страницу /docs рисует swagger-ui, который
        # FastAPI подключает с cdn.jsdelivr.net. На контуре без выхода
        # в интернет она останется пустой, и доказательством М-17 будет
        # /openapi.json (машинное описание) плюс examples.sh, а не картинка.
        location ~ ^/(docs|redoc|openapi\.json|health)$ {
            limit_req zone=arm burst=120 nodelay;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=arm burst=120 nodelay;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Локация под поток уведомлений (Q4.5, MOS-42) убрана 21.09.2026 —
        # держала несуществующий метод под отменённым префиксом /api/v1
        # (нашла 21, MOS-137; прижился /api/*, без версии). Метод появится —
        # понадобится своя настройка (буферизация выключена, лимит запросов
        # не подходит для одного долгоживущего соединения) под настоящий
        # путь, не под этот черновик.
    }
}

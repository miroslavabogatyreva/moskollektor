# Доступ к базе стенда (задача 1.6, MOS-82). Подключается через hba_file
# в deploy/docker-compose.yml, поэтому действует и на свежей установке,
# и на кластере, который initdb завёл раньше со своим pg_hba.conf.
#
# Сокет пускает без пароля: на него попадает только тот, у кого уже есть шелл
# в контейнере db, а это root над файлами данных. На нём держатся
# `docker compose exec db psql`, deploy/backup.sh и накат из docker-entrypoint.
# Любой адрес, включая 127.0.0.1 и ::1 внутри контейнера, — только по паролю.
# До 27.09.2026 здесь действовал pg_hba.conf от initdb с `host … 127.0.0.1/32
# trust`, и приёмка 15.09.2026 зашла по паролю «неверный».

# TYPE  DATABASE     USER  ADDRESS  METHOD
local   all          all            trust
local   replication  all            trust
host    all          all   all      scram-sha-256
host    replication  all   all      scram-sha-256

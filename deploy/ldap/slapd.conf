# Классический slapd.conf, а не cn=config — на четыре учётки динамический
# конфиг не нужен, а статический проще читать и проще собрать в образ.
include         /etc/ldap/schema/core.schema
include         /etc/ldap/schema/cosine.schema
include         /etc/ldap/schema/inetorgperson.schema
include         /etc/ldap/schema/nis.schema

# Пакет slapd в Debian собран с динамическими backend-модулями — без явной
# загрузки back_mdb «database mdb» ниже не стартует («Unrecognized database
# type», проверено запуском настоящего slapd).
modulepath      /usr/lib/ldap
moduleload      back_mdb.la

pidfile         /var/run/slapd/slapd.pid
argsfile        /var/run/slapd/slapd.args

database        mdb
maxsize         1073741824
suffix          "dc=moskollektor,dc=local"
rootdn          "cn=admin,dc=moskollektor,dc=local"
# Пароль администратора каталога — LdapAdmin#2026, {SSHA}-хеш ниже.
# Каталог только demo/приёмочный, порт наружу не публикуется (docker-compose.yml),
# бинд снаружи compose-сети недоступен — это не граница безопасности продукта.
rootpw          {SSHA}CE9YNUWX1DXv9/gZJ38cd+sPycJWvkop
directory       /var/lib/ldap

index           objectClass eq
index           uid eq
index           cn eq
index           member eq

# Стенд «Москоллектор». Состав описан в docs/HLD.md разд. 1.
#
# Сегодня поднимаются три сервиса из пяти: db, nginx и migrate (MOS-85,
# 15.09.2026) — backend/Dockerfile и backend/app/migrate.py уже есть,
# public.schema_migration на стенде накачена. api и worker всё ещё собирать
# не из чего: их код появится в Q3 и Q4, образ ml приезжает от Николая (Q7.3).
# Все три описаны ниже под профилем app и полностью включатся командой
#   docker compose --profile app up -d
# когда у api и worker будет код. Так файл остаётся описью системы целиком,
# а не только той части, что работает сегодня.

name: moskollektor

services:

  db:
    image: postgis/postgis:18-3.6
    # Образ собран только под linux/amd64: в манифесте тега 18-3.6 ветки arm64
    # нет. На сервере заказчика это родная архитектура (x86_64), на маке
    # разработчика — эмуляция. Пишем платформу явно, чтобы на маке видеть
    # осознанный выбор, а не предупреждение о несовпадении при первом запуске.
    platform: linux/amd64
    # MOS-222 (Q1.17). Докер даёт /dev/shm 64 МБ по умолчанию — на нём падал
    # чужой запрос с "could not resize shared memory segment", пока сессия 50
    # держала параллельный план (3 участника: leader + 2 воркера) на журнале
    # СМВУ за месяц.
    #
    # Считаем не от shared_buffers — SHOW shared_memory_type на стенде
    # 23.09.2026 отвечает mmap (умолчание с PG12), а не sysv: основной пул
    # Postgres лежит в анонимном mmap, /dev/shm им не пользуется вовсе.
    # /dev/shm занимает SHOW dynamic_shared_memory_type = posix — это память
    # ПАРАЛЛЕЛЬНЫХ воркеров (общая хеш-таблица parallel hash join, общие
    # тюпл-очереди gather merge). Бюджет parallel hash join — не сам work_mem,
    # а work_mem × hash_mem_multiplier на КАЖДОГО участника, включая лидера
    # (нашла 5e: моя первая прикидка сложила только воркеров и посчитала бюджет
    # общим на хеш-узел, а не на участника). SHOW work_mem = 64MB, SHOW
    # hash_mem_multiplier = 2 (умолчание с PG15) — 128 МБ на участника; SHOW
    # max_parallel_workers = 8 воркеров, при per_gather=2 это до 4 gather-узлов
    # разом, у каждого свой лидер — 12 участников × 128 МБ = 1536 МБ, и это на
    # ОДИН hash-узел плана: два parallel hash join в одном запросе — два таких
    # бюджета. 1024m — оценка на 8 параллельных участников с запасом против
    # самого инцидента (3 участника × 128 МБ = 384 МБ против прежних 64 МБ),
    # а не жёсткий предел — он растёт с числом лидеров и хеш-узлов в плане.
    # Хост даёт 5,9 ГБ на /dev/shm (df -h, 23.09.2026), 1 ГиБ — шестая доля.
    shm_size: 1024m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      # В PostgreSQL 18 каталог данных переехал: PGDATA теперь
      # /var/lib/postgresql/18/docker, а VOLUME объявлен на /var/lib/postgresql.
      # Смонтировать том на .../data, как делали до 17-й ветки, — значит отдать
      # кластер анонимному тому: `docker compose down -v` сотрёт базу, а бэкап
      # заберёт ноль байт из пустого каталога.
      - pgdata:/var/lib/postgresql
      - backups:/backups
    ports:
      # Наружу база не смотрит: только петля хоста, чтобы ходить psql-ом со стенда.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.31-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    healthcheck:
      # Адрес именно 127.0.0.1, а не localhost. В контейнере /etc/hosts отдаёт на имя
      # localhost два адреса, и wget из busybox берёт первым ::1, а nginx слушает
      # только IPv4 (listen 443 ssl без строки listen [::]:443). Ответ — connection
      # refused, healthcheck краснеет навсегда при исправно работающем сервере.
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # ponytail: сжатие здесь gzip, а не brotli. HLD разд. 3.5 считает размеры
    # ответов по brotli, но модуля ngx_brotli в официальном образе нет, а своя
    # сборка nginx ради сжатия статики, которой ещё не существует, — работа
    # не этой задачи. Вернуться в Q5.1, когда появится фронт: либо образ
    # с модулем, либо статика, пожатая заранее, и ngx_http_gzip_static_module.

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ML_URL: ${ML_URL}
      TZ: ${TZ}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /health объявлен прямо на app, мимо роутера /api и мимо журнала действий
      # (backend/app/api/main.py): живость сервера не должна зависеть ни от базы,
      # ни от прав, ни от записи в audit.user_action. curl в образе нет, зовём
      # питоном — он тут заведомо есть.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    # -u: без него print буферизуется, и `docker logs` не увидит строку
    # «пропущено: блокировка занята», пока буфер не заполнится или процесс
    # не упадёт — для постоянного процесса (не для одного прогона run.py)
    # это значит «почти никогда».
    command: ["python", "-u", "-m", "app.worker.scheduler"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ML_URL: ${ML_URL}
      TZ: ${TZ}
      SCHEDULER_INTERVAL_MIN: ${SCHEDULER_INTERVAL_MIN:-4}
      SCHEDULER_REFRESH_INTERVAL_MIN: ${SCHEDULER_REFRESH_INTERVAL_MIN:-5}
      # Пусто — расчёт идёт прежним путём, своими 22 признаками feat.v1.
      # Задано — worker берёт вероятности и 42 признака из выдачи модели v3
      # (backend/app/worker/run_v3.py). Файл кладёт образ ml-score по расписанию.
      SCORE_V3_PATH: ${SCORE_V3_PATH:-}
      SCORE_V3_MAX_AGE_H: ${SCORE_V3_MAX_AGE_H:-1.5}
    volumes:
      - parquet:/srv/parquet
      - uploads:/srv/uploads
      # Только на чтение: пишет сюда ml-score, worker читает. Права на запись
      # у читателя — это способ однажды затереть выдачу модели своей ошибкой.
      - score:/score:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Задача Q3.4 (MOS-34): точка входа теперь планировщик, а не один прогон.
    #
    # `python -m app.worker.scheduler` — процесс живёт постоянно и сам зовёт
    # расчёт каждые SCHEDULER_INTERVAL_MIN минут (backend/app/worker/scheduler.py).
    # Поэтому `restart: unless-stopped` здесь корректен: штатный выход означает
    # падение процесса, а не завершённый прогон, как было раньше с `app.worker.run`.
    #
    # Старая ловушка 16.09.2026 (стенд насчитал 36 прогонов за 15 минут, по одному
    # каждые 25 секунд) была именно в этом: `app.worker.run` — ОДИН прогон, он
    # считает и выходит кодом 0, и `restart: unless-stopped` поднимал контейнер
    # заново на каждый штатный выход. Сейчас тот же риск не возникает, потому что
    # процесс, который перезапускает docker, — планировщик, а не сам расчёт.
    #
    # Ручной прогон на конкретный срез остаётся отдельной командой, мимо службы:
    #   docker compose --profile app run --rm worker \
    #     python -m app.worker.run --as-of 2026-06-30T23:59:59+03:00
    # Без --as-of расчёт идёт на now(), выгрузка заказчика кончается 30.06.2026,
    # и все 3 173 участка получают единственную фразу «Датчики этого участка
    # молчат N суток» — прогноз, арифметически верный и пустой по смыслу.
    restart: unless-stopped

  ml:
    profiles: ["app"]
    # Образ Николая. Пока его нет, здесь стоит заглушка из Q7.3 (MOS-66):
    # собирается командой `docker build -t moskollektor/ml-stub:latest -f ml-stub/Dockerfile .`
    # из корня репозитория. Подмена на настоящую модель — правка ML_IMAGE в deploy/.env,
    # ни одной строки кода у нас при этом не меняется.
    image: ${ML_IMAGE}
    healthcheck:
      # Проверяем /model, а не /predict: это метод из контракта (docs/HLD.md разд. 6),
      # он есть и у заглушки, и у образа Николая, и он ничего не считает. curl
      # в python:3.14-slim нет, поэтому зовём питоном — он есть в любом ML-образе.
      # Разойдётся устройство образа Николая — снимаем эти четыре строки, они не
      # держат ни одной зависимости: service_healthy на ml никто не ждёт.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/model').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Демонстрационный каталог LDAP (MOS-39, НФ-76). Сам не поднимается —
  # только командой с двумя профилями:
  #   docker compose --profile app --profile ldap up -d
  # Заказчик не даёт доступа к своему каталогу («любой LDAP сервис» — ответ
  # 31, docs/meetings/2026-09-17-эксперты.md), поэтому доказываем НФ-76 своим
  # маленьким сервером, а не заглушкой в коде: настоящий bind, настоящий отказ
  # bind после block-user.sh.
  ldap:
    profiles: ["ldap"]
    build:
      context: ..
      dockerfile: deploy/ldap/Dockerfile
    # Порт не публикуется наружу — api ходит по имени сервиса внутри сети
    # compose (LDAP_URI=ldap://ldap:389 в .env).
    restart: unless-stopped

  # Накат миграций. Живёт секунды и выходит: HLD разд. 7.1 называет его
  # отдельным контейнером, чтобы схема не накатывалась из api при каждом старте.
  migrate:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    # Имя модуля — из docs/HLD.md разд. 7.1: там app.migrate, тридцать строк, читает
    # db/migrations/*.sql по возрастанию номера. Раньше здесь стояло app.db.migrate,
    # то есть пакет app/db/ — такого каталога нет ни в дереве, ни в HLD.
    command: ["python", "-m", "app.migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  parquet:
  uploads:
  backups:
  # Сюда образ ml-score кладёт score.json — выдачу модели v3 на момент среза
  # (контракт score.v3, docs/ml-v3-hld.md). Том, а не каталог на хосте: путь
  # на сервере заказчика мы не знаем, а имя тома одинаково везде.
  score:
